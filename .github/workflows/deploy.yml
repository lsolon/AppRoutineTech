name: Deploy para VPS

on:
  push:
    branches:
      - main  # Vai rodar sempre que houver código novo na branch 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectando e atualizando a VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Entra na pasta do seu site
            cd /var/www/approutinetech
            
            # 2. Puxa as atualizações do GitHub
            git pull origin main
            
            # 3. Instala dependências novas (caso existam)
            npm install
            
            # 4. Faz a build da aplicação
            npm run build
            
            # 5. Reinicia o servidor (Descomente o que fizer sentido para você)
            # pm2 restart approutinetech
            # systemctl restart nginx
